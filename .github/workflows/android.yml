name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6" || true
      - name: Prepare Android OpenCL headers and ICD loader
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_HOME/ndk/29.0.13113456"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          rm -rf /tmp/OpenCL-Headers /tmp/OpenCL-ICD-Loader /tmp/opencl-loader-build
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git /tmp/OpenCL-Headers
          cp -r /tmp/OpenCL-Headers/CL "$SYSROOT/usr/include/"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader.git /tmp/OpenCL-ICD-Loader
          cmake -S /tmp/OpenCL-ICD-Loader -B /tmp/opencl-loader-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$SYSROOT/usr/include" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=24 \
            -DANDROID_STL=c++_shared \
            -DENABLE_OPENCL_LAYERS=OFF
          cmake --build /tmp/opencl-loader-build --parallel 4
          cp /tmp/opencl-loader-build/libOpenCL.so "$SYSROOT/usr/lib/aarch64-linux-android/libOpenCL.so"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/opencl-loader-build/libOpenCL.so app/src/main/jniLibs/arm64-v8a/libOpenCL.so
      - name: Apply v0.1.19 source patch
        run: python3 scripts/patch_v018.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare release files
        id: prep
        shell: bash
        run: |
          VERSION_NAME=$(grep '^JINKAKU_VERSION_NAME=' gradle.properties | cut -d= -f2)
          VERSION_CODE=$(grep '^JINKAKU_VERSION_CODE=' gradle.properties | cut -d= -f2)
          cp app/build/outputs/apk/release/app-release.apk "jinkaku-v${VERSION_NAME}.apk"
          printf '{"versionName":"%s","versionCode":%s,"apk":"jinkaku-v%s.apk"}\n' "$VERSION_NAME" "$VERSION_CODE" "$VERSION_NAME" > version.json
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: jinkaku-apk
          path: jinkaku-v*.apk
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.prep.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Jinkaku $TAG" --notes "Automated personal release." --target "$GITHUB_SHA"
          gh release upload "$TAG" jinkaku-v*.apk version.json --clobber
