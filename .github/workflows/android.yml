name: Android Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6" || true
      - name: Apply legacy source patches
        run: |
          python3 scripts/patch_cpu_speed_v022.py
          python3 scripts/patch_v024_thinking_idle_memory.py
          python3 scripts/fix_v024_prompt_patch.py
          python3 scripts/patch_v026_chat_delete.py
          python3 scripts/patch_v028_sampling_controls.py
          python3 scripts/patch_v029_memory_edit_accent.py
          python3 scripts/patch_v031_visual_theme.py
          python3 scripts/patch_v041_wordmark_png.py
          python3 scripts/patch_v042_brand_finish.py
          python3 scripts/patch_v043_vivid_mix.py
          python3 scripts/patch_v046_finish.py
          python3 scripts/fix_v046_compile.py
          python3 scripts/prepare_v047_ci.py
          python3 scripts/patch_v047_ui_refine.py
          python3 scripts/patch_v048_candy_glass.py
          python3 scripts/patch_v049_kawaii_glass.py
          python3 scripts/patch_v050_edge_gloss.py
          python3 scripts/patch_v051_bright_accents.py
          python3 scripts/patch_v052_sparkle_back.py
          python3 scripts/patch_v053_wordmark.py
          python3 scripts/patch_v054_diagonal_glass.py
          python3 scripts/patch_v056_customization.py
          python3 scripts/fix_v056_canvas.py
          python3 scripts/patch_v057_custom_ai_avatar.py
          python3 scripts/patch_v058_avatar_crop.py
          python3 scripts/patch_v060_ui_visibility.py
          python3 scripts/patch_v061_memory_role_attribution.py
          python3 scripts/fix_v062_patch_anchors.py
          python3 scripts/patch_v062_tavily_web_search.py
          python3 scripts/patch_v063_web_prefill_budget.py
          python3 scripts/patch_v064_monologue.py
          python3 scripts/patch_v066_random_persona.py
          python3 scripts/patch_v067_reply_style.py
          python3 scripts/patch_v068_settings_categories.py
          python3 scripts/patch_v069_thinking_budget.py
          python3 scripts/fix_v072_main_chat_patch.py
          python3 scripts/patch_v070_e2b_import_version.py
          python3 scripts/fix_v073_e2b_selector_routing.py
          python3 scripts/fix_v074_e2b_thought_channel.py
          python3 scripts/fix_v076_e2b_gpu_mtp_fixed.py
      - name: Convert generated app to E2B only
        run: |
          python3 scripts/prepare_v077_ci.py
          python3 scripts/patch_v077_e2b_only.py
          python3 scripts/finalize_v077_ci.py
          python3 scripts/fix_v078_boot_thinking.py
          python3 scripts/patch_v079_telemetry_context8k.py
          python3 scripts/patch_v080_live_feedback.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build E2B LiteRT-LM release APK
        env:
          CI_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleRelease -PJINKAKU_VERSION_CODE="$CI_VERSION_CODE"
      - name: Prepare release files
        id: prep
        shell: bash
        run: |
          VERSION_NAME=$(grep '^JINKAKU_VERSION_NAME=' gradle.properties | cut -d= -f2)
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          APK_NAME="jinkaku-v${VERSION_NAME}-b${VERSION_CODE}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          printf '{"versionName":"%s","versionCode":%s,"apk":"%s"}\n' "$VERSION_NAME" "$VERSION_CODE" "$APK_NAME" > version.json
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: jinkaku-apk
          path: jinkaku-v*.apk
      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.prep.outputs.version }}-b${{ steps.prep.outputs.code }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Jinkaku v${{ steps.prep.outputs.version }} build ${{ steps.prep.outputs.code }}" --notes "E2B LiteRT-LM: Thinking, live context meter, animated writing indicator, TTFT/Prefill/Decode telemetry, restored model settings, and 8K context." --target "$GITHUB_SHA"
          gh release upload "$TAG" "${{ steps.prep.outputs.apk }}" version.json --clobber
