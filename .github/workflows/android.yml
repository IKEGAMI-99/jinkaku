name: Android Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6" || true
      - name: Apply CPU runtime patches
        run: |
          python3 scripts/patch_cpu_speed_v022.py
          python3 scripts/patch_v024_thinking_idle_memory.py
          python3 scripts/fix_v024_prompt_patch.py
          python3 scripts/patch_v026_chat_delete.py
          python3 scripts/patch_v028_sampling_controls.py
          python3 scripts/patch_v029_memory_edit_accent.py
          python3 scripts/patch_v031_visual_theme.py
          python3 scripts/patch_v039_wordmark_only.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build CPU release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare release files
        id: prep
        shell: bash
        run: |
          VERSION_NAME=$(grep '^JINKAKU_VERSION_NAME=' gradle.properties | cut -d= -f2)
          VERSION_CODE=$(grep '^JINKAKU_VERSION_CODE=' gradle.properties | cut -d= -f2)
          cp app/build/outputs/apk/release/app-release.apk "jinkaku-v${VERSION_NAME}.apk"
          printf '{"versionName":"%s","versionCode":%s,"apk":"jinkaku-v%s.apk"}\n' "$VERSION_NAME" "$VERSION_CODE" "$VERSION_NAME" > version.json
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: jinkaku-apk
          path: jinkaku-v*.apk
      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.prep.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Jinkaku $TAG" --notes "Automated personal release." --target "$GITHUB_SHA"
          gh release upload "$TAG" jinkaku-v*.apk version.json --clobber
