name: Patch chat interaction

on:
  push:
    paths:
      - scripts/patch_chat_interaction.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python scripts/patch_chat_interaction.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ikegami99/jinkaku/ui/ModernJinkakuApp.kt \
                  app/src/main/java/com/ikegami99/jinkaku/JinkakuViewModel.kt \
                  app/src/main/java/com/ikegami99/jinkaku/data/JinkakuDatabase.kt
          git commit -m "Improve typing timing and chat history controls"
          git push
